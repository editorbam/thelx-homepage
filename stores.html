let slRegion = 'all';
let slQuery  = '';

function slPhone1(p) {
  const m = p.match(/[\d]{2,3}-[\d]{3,4}-[\d]{4}/);
  return m ? m[0] : p.replace(/[^0-9]/g,'').slice(0,11);
}

var SL_PAGE = 12;
var slShown = SL_PAGE;

/* ── 시공점 지도 (MapLibre · OpenFreeMap 모노톤) — 필터·검색 결과와 동기, 라벨 한글화 ── */
let slMap = null, slMapReady = false, slPending = null;

function slGeojson(list) {
  return { type: 'FeatureCollection', features: list.filter(s => s.y != null).map(s => ({
    type: 'Feature',
    geometry: { type: 'Point', coordinates: [s.x, s.y] },
    properties: { n: s.n, a: s.a, p: s.p, lx: s.n.toUpperCase().indexOf('LX') !== -1 ? 1 : 0 },
  })) };
}

(function slInitMap(){
  if (!window.maplibregl) { document.getElementById('slMap').classList.add('no-map'); return; }
  slMap = new maplibregl.Map({
    container: 'slMap',
    style: 'https://tiles.openfreemap.org/styles/positron',
    center: [127.8, 36.4], zoom: 6,
  });
  slMap.addControl(new maplibregl.NavigationControl({ showCompass: false }));
  /* 스크롤 하이재킹 방지: 클릭 후에만 휠 줌 */
  slMap.scrollZoom.disable();
  slMap.on('click', () => slMap.scrollZoom.enable());
  slMap.getContainer().addEventListener('mouseleave', () => slMap.scrollZoom.disable());
  /* 모바일: 페이지 스크롤 중 지도에 손가락이 닿아도 안 끌리게 — 탭 후에만 드래그 */
  if ('ontouchstart' in window) {
    slMap.dragPan.disable();
    slMap.on('click', () => slMap.dragPan.enable());
  }

  slMap.on('load', () => {
    /* 라벨 한글화 — name:ko 우선, 없으면 기본 name(국내 지명 원본=한글) */
    slMap.getStyle().layers.forEach(l => {
      if (l.type === 'symbol' && l.layout && l.layout['text-field']) {
        slMap.setLayoutProperty(l.id, 'text-field', ['coalesce', ['get', 'name:ko'], ['get', 'name']]);
      }
    });

    slMap.addSource('stores', { type: 'geojson', data: slGeojson([]), cluster: true, clusterRadius: 46, clusterMaxZoom: 13 });
    slMap.addLayer({ id: 'st-cluster', type: 'circle', source: 'stores', filter: ['has', 'point_count'],
      paint: { 'circle-color': '#0a0a0a', 'circle-radius': 17, 'circle-stroke-width': 2, 'circle-stroke-color': '#ffffff' } });
    slMap.addLayer({ id: 'st-count', type: 'symbol', source: 'stores', filter: ['has', 'point_count'],
      layout: { 'text-field': ['get', 'point_count_abbreviated'], 'text-font': ['Noto Sans Regular'], 'text-size': 12 },
      paint: { 'text-color': '#ffffff' } });
    slMap.addLayer({ id: 'st-pin', type: 'circle', source: 'stores', filter: ['!', ['has', 'point_count']],
      paint: { 'circle-radius': 10, 'circle-color': ['case', ['==', ['get', 'lx'], 1], '#0a0a0a', '#ffffff'],
               'circle-stroke-width': 1.5, 'circle-stroke-color': '#0a0a0a' } });
    /* 핀 위 LX / S 글자 — 매장 구분 (LX=검정 바탕 흰 글자, 솔라가드=흰 바탕 검정 글자) */
    slMap.addLayer({ id: 'st-pin-label', type: 'symbol', source: 'stores', filter: ['!', ['has', 'point_count']],
      layout: { 'text-field': ['case', ['==', ['get', 'lx'], 1], 'LX', 'S'], 'text-font': ['Noto Sans Regular'],
                'text-size': 9, 'text-allow-overlap': true, 'text-ignore-placement': true },
      paint: { 'text-color': ['case', ['==', ['get', 'lx'], 1], '#ffffff', '#0a0a0a'] } });

    slMap.on('click', 'st-cluster', e => {
      const f = slMap.queryRenderedFeatures(e.point, { layers: ['st-cluster'] })[0];
      const r = slMap.getSource('stores').getClusterExpansionZoom(f.properties.cluster_id);
      const go = z => slMap.easeTo({ center: f.geometry.coordinates, zoom: z });
      if (r && r.then) r.then(go); else slMap.getSource('stores').getClusterExpansionZoom(f.properties.cluster_id, (err, z) => { if (!err) go(z); });
    });

    /* 호버 툴팁 — 지점명·주소·전화 (클릭 팝업과 별개, 버튼 없음) */
    const slHover = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 14 });
    function slPinPopupHtml(pr, withBtns) {
      const mapUrl = 'https://map.naver.com/v5/search/' + encodeURIComponent(pr.a);
      return '<div class="sl-pop"><strong>' + pr.n + '</strong><span>' + pr.a + '</span><span>' + pr.p + '</span>' +
        (withBtns ? '<span class="sl-pop-btns"><a href="' + mapUrl + '" target="_blank" rel="noopener">네이버 지도</a><a href="tel:' + slPhone1(pr.p) + '">전화</a></span>' : '') +
        '</div>';
    }
    const PIN_LAYERS = ['st-pin', 'st-pin-label'];
    PIN_LAYERS.forEach(id => {
      slMap.on('click', id, e => {
        slHover.remove();
        new maplibregl.Popup({ offset: 14 }).setLngLat(e.features[0].geometry.coordinates)
          .setHTML(slPinPopupHtml(e.features[0].properties, true)).addTo(slMap);
      });
      slMap.on('mousemove', id, e => {
        slMap.getCanvas().style.cursor = 'pointer';
        const f = e.features[0];
        slHover.setLngLat(f.geometry.coordinates).setHTML(slPinPopupHtml(f.properties, false)).addTo(slMap);
      });
      slMap.on('mouseleave', id, () => {
        slMap.getCanvas().style.cursor = '';
        slHover.remove();
      });
    });
    slMap.on('mouseenter', 'st-cluster', () => slMap.getCanvas().style.cursor = 'pointer');
    slMap.on('mouseleave', 'st-cluster', () => slMap.getCanvas().style.cursor = '');

    slMapReady = true;
    if (slPending) { slMapApply(slPending); slPending = null; }
  });
})();

function slMapApply(list) {
  slMap.getSource('stores').setData(slGeojson(list));
  const pts = list.filter(s => s.y != null);
  if (pts.length) {
    const b = new maplibregl.LngLatBounds();
    pts.forEach(s => b.extend([s.x, s.y]));
    slMap.fitBounds(b, { padding: 48, maxZoom: 12, duration: 600 });
  }
}

function slMapUpdate(list) {
  if (!slMap) return;
  if (!slMapReady) { slPending = list; return; }
  slMapApply(list);
}

function slRender() {
  const q   = slQuery.toLowerCase();
  const filtered = STORE_DATA.filter(s => {
    const matchR = slRegion === 'all' || s.r === slRegion;
    const matchQ = !q || s.n.toLowerCase().includes(q) || s.a.toLowerCase().includes(q);
    return matchR && matchQ;
  });

  const grid  = document.getElementById('slGrid');
  const count = document.getElementById('slCount');
  count.textContent = filtered.length + '개의 시공점';
  slMapUpdate(filtered);

  if (filtered.length === 0) {
    grid.innerHTML = '<p class="sl-empty">검색 결과가 없습니다.</p>';
    return;
  }

  var visible = filtered.slice(0, slShown);
  var remaining = filtered.length - slShown;

  grid.innerHTML = visible.map(s => {
    const mapUrl = 'https://map.naver.com/v5/search/' + encodeURIComponent(s.a);
    const tel    = slPhone1(s.p);
    return `<div class="sl-card">
      <p class="sl-card-name">${s.n}</p>
      <p class="sl-card-addr">${s.a}</p>
      <p class="sl-card-phone">${s.p}</p>
      <div class="sl-card-btns">
        <a class="sl-btn-map" href="${mapUrl}" target="_blank" rel="noopener">네이버 지도</a>
        <a class="sl-btn-tel" href="tel:${tel}">전화</a>
      </div>
    </div>`;
  }).join('');

  if (remaining > 0) {
    grid.innerHTML += `<div class="sl-more-wrap"><button class="sl-more-btn" id="slMoreBtn">+ ${remaining}개 더보기</button></div>`;
    document.getElementById('slMoreBtn').addEventListener('click', function() {
      slShown += SL_PAGE;
      slRender();
    });
  }
}

document.querySelectorAll('.sl-rtab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sl-rtab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    slRegion = btn.dataset.r;
    slShown = SL_PAGE;
    slRender();
  });
});

document.getElementById('slSearch').addEventListener('input', e => {
  slQuery = e.target.value;
  slShown = SL_PAGE;
  slRender();
});

/* URL 파라미터로 초기 필터 적용 — index 요약 블록에서 진입 (?r=지역 / ?q=검색어) */
(function(){
  const params = new URLSearchParams(location.search);
  const pr = params.get('r'), pq = params.get('q');
  if (pr) {
    const tab = document.querySelector(`.sl-rtab[data-r="${CSS.escape(pr)}"]`);
    if (tab) {
      document.querySelectorAll('.sl-rtab').forEach(b => b.classList.remove('active'));
      tab.classList.add('active');
      slRegion = pr;
    }
  }
  if (pq) {
    slQuery = pq;
    document.getElementById('slSearch').value = pq;
  }
})();
slRender();


</script>

<!-- 배경 음악 (전 페이지 이어듣기 — sessionStorage 'thelxBgm'로 위치·상태 왕복) -->
<button class="hero-sound" id="heroSound" type="button" aria-label="배경 음악 음소거 / 해제" aria-pressed="false">
  <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  <span class="label" id="heroSoundLabel">Mute</span>
</button>
<audio id="heroAudio" src="hero-music.mp3" loop preload="auto"></audio>
<script>
  (function(){
    var audio = document.getElementById('heroAudio');
    var btn   = document.getElementById('heroSound');
    var label = document.getElementById('heroSoundLabel');
    if(!audio || !btn) return;
    var TARGET = 1.0;
    var started = false, muted = false, fadeTimer = null;
    audio.volume = 0;
    btn.classList.add('show');

    // 페이지 간 이어듣기 — 떠날 때 위치·상태 저장, 들어올 때 그 지점부터
    var resume = null;
    try { resume = JSON.parse(sessionStorage.getItem('thelxBgm') || 'null'); } catch(e){}
    var wantSound = resume ? !!resume.on : true;
    function applySeek(){
      if(resume && resume.t > 0 && audio.duration){ try { audio.currentTime = resume.t % audio.duration; } catch(e){} }
    }
    if(audio.readyState > 0) applySeek();
    else audio.addEventListener('loadedmetadata', applySeek, { once:true });
    window.addEventListener('pagehide', function(){
      try {
        sessionStorage.setItem('thelxBgm', JSON.stringify({
          t: started ? audio.currentTime : (resume ? resume.t : 0),
          on: started ? !muted : wantSound
        }));
      } catch(e){}
    });

    function fadeTo(target, done){
      if(fadeTimer) clearInterval(fadeTimer);
      var steps = 14, i = 0, start = audio.volume, delta = (target - start)/steps;
      fadeTimer = setInterval(function(){
        i++; audio.volume = Math.min(1, Math.max(0, start + delta*i));
        if(i>=steps){ audio.volume = target; clearInterval(fadeTimer); fadeTimer=null; if(done) done(); }
      }, 45);
    }
    function updateUI(){
      var on = started && !muted;
      btn.classList.toggle('playing', on);
      btn.setAttribute('aria-pressed', muted ? 'true' : 'false');
      label.textContent = (started && muted) ? 'Muted' : 'Mute';
    }

    var GESTURES = ['pointerdown','keydown','scroll','touchstart'];
    function dropGestures(){ GESTURES.forEach(function(ev){ window.removeEventListener(ev, firstGesture); }); }

    function startPlayback(){
      if(started) return;
      audio.muted = !wantSound;   // 이전 페이지에서 음소거 상태였다면 그 선택을 존중
      audio.play().then(function(){ started = true; muted = !wantSound; fadeTo(TARGET); updateUI(); dropGestures(); })
                  .catch(function(){ /* 브라우저가 막음 — 다음 제스처/클릭 때 재시도 */ });
    }
    function setMuted(m){ muted = m; audio.muted = m; updateUI(); }

    btn.addEventListener('click', function(e){
      e.stopPropagation();
      if(!started){ wantSound = true; startPlayback(); }
      else { setMuted(!muted); }
    });

    function firstGesture(e){
      if(e && btn.contains(e.target)) return;
      startPlayback();
    }
    GESTURES.forEach(function(ev){ window.addEventListener(ev, firstGesture, {passive:true}); });

    // 이전 페이지에서 음악이 흐르던 중이었다면 즉시 이어재생 시도 (막히면 첫 제스처에서 재개)
    if(resume && resume.on){ startPlayback(); }
  })();
</script>
