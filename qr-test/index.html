<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>품질보증서 · 스티커 번호로 열기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&display=swap">
<style>
/* THE LX 조회 페이지 문법 상속 (잉크 검정·헤어라인·pill·Noto Sans KR) — sgp warranty_order/style.css 2026-08-12 */
:root{--black:#0a0a0a;--white:#fff;--gray-1:#f5f5f7;--gray-2:#e8e8ed;--gray-3:#6e6e73;--gray-4:#1d1d1f;--hl:#e6ff32}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-text-size-adjust:none}
html{font-size:16px}
body{min-height:100dvh;background:var(--white);color:var(--black);font-family:'Noto Sans KR',-apple-system,'Helvetica Neue',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;line-height:1.6}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
[hidden]{display:none!important}

/* ── 랜딩 ── */
.wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 36px) 24px calc(env(safe-area-inset-bottom) + 40px)}
.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gray-3);margin-bottom:1.1rem}
h1{font-size:clamp(1.7rem,7vw,2.2rem);font-weight:300;letter-spacing:-.01em;line-height:1.25;text-wrap:balance}
h1 em{font-style:normal;font-weight:600}
.sub{margin-top:.9rem;color:var(--gray-3);font-size:.95rem;word-break:keep-all}
.cta{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;height:60px;margin-top:1.8rem;border-radius:999px;background:var(--black);color:var(--white);font-size:1.02rem;font-weight:500;letter-spacing:-.01em}
.cta svg{width:20px;height:20px}
.cta:disabled{opacity:.45}
.or{display:flex;align-items:center;gap:.9rem;margin:1.6rem 0 .9rem;color:var(--gray-3);font-size:.8rem}
.or::before,.or::after{content:'';flex:1;height:.5px;background:var(--gray-2)}
.manual{display:flex;gap:.6rem}
.manual input{flex:1;min-width:0;height:56px;padding:0 1.1rem;border:.5px solid var(--gray-2);border-radius:14px;background:var(--white);font-size:1.25rem;letter-spacing:.16em;font-variant-numeric:tabular-nums;color:var(--black);outline:none}
.manual input:focus{border-color:var(--black)}
.manual input::placeholder{letter-spacing:.04em;font-size:.95rem;color:var(--gray-3)}
.manual button{height:56px;padding:0 1.3rem;border-radius:999px;border:.5px solid var(--black);font-size:.95rem;font-weight:500;white-space:nowrap}
.where{display:flex;gap:.9rem;align-items:center;margin-top:1.4rem;padding:.9rem 1rem;border-radius:14px;background:var(--gray-1);font-size:.85rem;color:var(--gray-3);word-break:keep-all}
.where .mini{flex:0 0 auto;width:58px;height:36px;border-radius:3px;background:#f6f6f2;border:.5px solid var(--gray-2);position:relative;overflow:hidden}
.mini::before{content:'';position:absolute;left:5px;top:6px;width:24px;height:24px;background:repeating-linear-gradient(0deg,#222 0 2px,transparent 2px 4px),repeating-linear-gradient(90deg,#222 0 2px,transparent 2px 4px);background-blend-mode:multiply;opacity:.75}
.mini::after{content:'NO.';position:absolute;right:5px;top:11px;font-size:7px;font-weight:600;color:#111;background:var(--hl);padding:0 2px;line-height:1.5}
.msg{margin-top:1rem;font-size:.85rem;color:var(--gray-3);min-height:1.3em}
.links{display:flex;flex-wrap:wrap;gap:1.2rem;margin-top:2.6rem;padding-top:1.2rem;border-top:.5px solid var(--gray-2);font-size:.85rem;color:var(--gray-3)}
.links a{text-decoration:underline;text-underline-offset:3px}
.foot{margin-top:2.4rem;font-size:.72rem;color:var(--gray-3);letter-spacing:.02em}

/* ── 카메라 ── */
#cam{position:fixed;inset:0;background:#000;color:#fff;z-index:10}
#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cam .shade{position:absolute;inset:0;background:rgba(0,0,0,.45);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  padding:var(--gt) var(--gx) var(--gb) var(--gx)}
#guide{position:absolute;left:var(--gx);right:var(--gx);top:var(--gt);height:var(--gh);border-radius:8px;box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
#guide.hit{box-shadow:0 0 0 2.5px var(--hl)}
#guide i{position:absolute;width:18px;height:18px;border:2.5px solid #fff;border-radius:2px}
#guide i:nth-child(1){left:-2px;top:-2px;border-right:0;border-bottom:0}
#guide i:nth-child(2){right:-2px;top:-2px;border-left:0;border-bottom:0}
#guide i:nth-child(3){left:-2px;bottom:-2px;border-right:0;border-top:0}
#guide i:nth-child(4){right:-2px;bottom:-2px;border-left:0;border-top:0}
#cam .hint{position:absolute;left:0;right:0;top:calc(var(--gt) - 3.2rem);text-align:center;font-size:.95rem;font-weight:400;text-shadow:0 1px 8px rgba(0,0,0,.6)}
#cam .read{position:absolute;left:0;right:0;top:calc(var(--gt) + var(--gh) + 1.2rem);text-align:center;font-size:1.5rem;letter-spacing:.14em;font-variant-numeric:tabular-nums;font-weight:500;min-height:2rem}
#cam .read small{display:block;font-size:.8rem;letter-spacing:0;font-weight:300;opacity:.8;margin-top:.2rem}
#cam .top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 0;display:flex;justify-content:space-between;align-items:center}
#cam .top button{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center}
#cam .top button.on{background:var(--hl);color:#111}
#cam .top svg{width:22px;height:22px}
#cam .bottom{position:absolute;left:0;right:0;bottom:0;padding:0 24px calc(env(safe-area-inset-bottom) + 22px);text-align:center}
#cam .bottom button{height:48px;padding:0 1.4rem;border-radius:999px;border:.5px solid rgba(255,255,255,.7);font-size:.9rem;font-weight:400}
#cam .status{margin-bottom:.9rem;font-size:.8rem;opacity:.75}
#cam .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#cam .flash.go{opacity:.85;transition:none}
@media (prefers-reduced-motion:reduce){#cam .flash{transition:none}}
</style>
</head>
<body>

<main class="wrap" id="landing">
  <div class="eyebrow">THE LX × Solar Gard Premium</div>
  <h1>스티커를 <em>한 번 더</em><br>비춰 주세요</h1>
  <p class="sub">스티커에 인쇄된 "NO." 뒤 숫자를 카메라가 읽어 품질보증서를 바로 엽니다.</p>

  <button class="cta" id="btnCam" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    카메라로 번호 읽기
  </button>
  <p class="msg" id="camMsg"></p>

  <div class="or">또는</div>
  <form class="manual" id="manual" autocomplete="off">
    <input id="no" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="NO. 뒤 8자리 직접 입력" aria-label="스티커 번호 8자리">
    <button type="submit">보증서 보기</button>
  </form>
  <div class="where"><div class="mini"></div><div>번호는 QR 옆 <b>NO.</b> 뒤 8자리입니다. 앞유리 안쪽 스티커를 보세요.</div></div>

  <nav class="links">
    <a href="https://isolargard.com/stores.html">전국 시공점</a>
    <a href="https://isolargard.com/technology.html">제품 사양</a>
    <a href="tel:16007530">A/S 문의 1600-7530</a>
  </nav>
  <p class="foot">시험판 · 실서버 미적용</p>
</main>

<section id="cam" hidden aria-label="스티커 번호 읽기">
  <video id="v" playsinline muted autoplay></video>
  <div class="shade"></div>
  <div class="hint">틀 안에 <b>NO.</b>와 숫자 8자리를 가로로 맞춰 주세요</div>
  <div id="guide"><i></i><i></i><i></i><i></i></div>
  <div class="read" id="read"></div>
  <div class="top">
    <button type="button" id="btnClose" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button type="button" id="btnTorch" aria-label="손전등" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2h8l1 6-3 3v11h-4V11L7 8z"/></svg></button>
  </div>
  <div class="bottom">
    <div class="status" id="status">인식 준비 중…</div>
    <button type="button" id="btnManual">직접 입력할게요</button>
  </div>
  <div class="flash" id="flash"></div>
  <canvas id="c" hidden></canvas>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script>
(function(){
  var VIEW='https://sgp.isolargard.com/warranty_order/warranty_order_view.php?idx=1&order_num1=';
  var q=new URLSearchParams(location.search);
  var TEST=q.get('test')==='1';

  /* ① 앞으로 QR 안에 번호가 들어오면(?no=8자리) 카메라 없이 바로 이동 */
  var pre=(q.get('no')||'').replace(/\D/g,'');
  if(pre.length===8){ location.replace(VIEW+pre); return; }

  var $=function(s){return document.querySelector(s)};
  var landing=$('#landing'), cam=$('#cam'), video=$('#v'), canvas=$('#c'), ctx=canvas.getContext('2d',{willReadFrequently:true});
  var guide=$('#guide'), readEl=$('#read'), statusEl=$('#status'), camMsg=$('#camMsg'), flash=$('#flash');
  var stream=null, track=null, worker=null, workerReady=false, busy=false, timer=null, last=null, done=false;

  function go(no){
    if(done) return; done=true;
    guide.classList.add('hit'); flash.classList.add('go');
    readEl.innerHTML=no.replace(/(\d{4})(\d{4})/,'$1 $2')+'<small>보증서 여는 중</small>';
    statusEl.textContent='';
    try{ navigator.vibrate&&navigator.vibrate([40,40,40]); }catch(e){}
    beep();
    setTimeout(function(){ location.href=VIEW+no; },450);
  }
  function beep(){
    try{ var A=window.AudioContext||window.webkitAudioContext; if(!A) return; var a=new A(),o=a.createOscillator(),g=a.createGain();
      o.frequency.value=1320; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.18,a.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.15); o.start(); o.stop(a.currentTime+.16); }catch(e){}
  }

  /* ② 수동 입력 */
  $('#manual').addEventListener('submit',function(e){
    e.preventDefault();
    var no=$('#no').value.replace(/\D/g,'');
    if(no.length!==8){ camMsg.textContent='숫자 8자리를 입력해 주세요.'; $('#no').focus(); return; }
    location.href=VIEW+no;
  });

  /* ③ 인식 엔진 미리 준비 (버튼 누르기 전부터) */
  function prepWorker(){
    if(worker||!window.Tesseract) return;
    Tesseract.createWorker('eng',1,{logger:function(){}}).then(function(w){
      worker=w;
      return w.setParameters({tessedit_char_whitelist:'0123456789NO.',tessedit_pageseg_mode:'7'});
    }).then(function(){ workerReady=true; statusEl.textContent='읽는 중'; })
      .catch(function(err){ statusEl.textContent='인식 엔진을 불러오지 못했습니다. 직접 입력해 주세요.'; console.error(err); });
  }
  if('requestIdleCallback' in window) requestIdleCallback(prepWorker); else setTimeout(prepWorker,300);

  /* ④ 카메라 */
  function layoutGuide(){
    var W=window.innerWidth,H=window.innerHeight;
    var gw=Math.min(W*0.84,560), gh=Math.round(gw/3.6);
    var gx=Math.round((W-gw)/2), gt=Math.round(H*0.36);
    cam.style.setProperty('--gx',gx+'px'); cam.style.setProperty('--gt',gt+'px');
    cam.style.setProperty('--gh',gh+'px'); cam.style.setProperty('--gb',(H-gt-gh)+'px');
    return {gx:gx,gt:gt,gw:gw,gh:gh,W:W,H:H};
  }
  function openCam(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ camMsg.textContent='이 브라우저는 카메라를 지원하지 않습니다. 아래에 직접 입력해 주세요.'; return; }
    camMsg.textContent=''; done=false; last=null;
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false})
    .then(function(s){
      stream=s; track=s.getVideoTracks()[0]; video.srcObject=s;
      landing.hidden=true; cam.hidden=false; layoutGuide();
      try{ if(track.getCapabilities&&track.getCapabilities().torch){ $('#btnTorch').hidden=false; } }catch(e){}
      prepWorker();
      statusEl.textContent=workerReady?'읽는 중':'인식 준비 중…';
      timer=setInterval(tick,550);
    })
    .catch(function(){ camMsg.textContent='카메라를 열 수 없습니다. 브라우저의 카메라 허용을 확인하거나 아래에 직접 입력해 주세요.'; $('#no').focus(); });
  }
  function closeCam(){
    clearInterval(timer); timer=null;
    if(stream){ stream.getTracks().forEach(function(t){t.stop()}); stream=null; track=null; }
    cam.hidden=true; landing.hidden=false; guide.classList.remove('hit'); flash.classList.remove('go'); readEl.textContent='';
  }
  var torchOn=false;
  $('#btnTorch').addEventListener('click',function(){
    if(!track) return; torchOn=!torchOn;
    track.applyConstraints({advanced:[{torch:torchOn}]}).catch(function(){});
    this.classList.toggle('on',torchOn);
  });
  $('#btnCam').addEventListener('click',openCam);
  $('#btnClose').addEventListener('click',closeCam);
  $('#btnManual').addEventListener('click',function(){ closeCam(); $('#no').focus(); });
  window.addEventListener('resize',function(){ if(!cam.hidden) layoutGuide(); });

  /* ⑤ 가이드 틀 영역만 잘라 인식 — 화면(object-fit:cover) 좌표 → 영상 좌표 */
  function tick(){
    if(busy||!workerReady||done||!video.videoWidth) return;
    var g=layoutGuide(), vw=video.videoWidth, vh=video.videoHeight;
    var scale=Math.max(g.W/vw, g.H/vh);           // cover 배율
    var offX=(vw*scale-g.W)/2, offY=(vh*scale-g.H)/2;
    var sx=(g.gx+offX)/scale, sy=(g.gt+offY)/scale, sw=g.gw/scale, sh=g.gh/scale;
    var tw=520, th=Math.round(tw*sh/sw);
    canvas.width=tw; canvas.height=th;
    ctx.drawImage(video,sx,sy,sw,sh,0,0,tw,th);
    enhance();
    busy=true;
    worker.recognize(canvas).then(function(r){ handle(r.data.text||''); }).catch(function(){}).finally(function(){ busy=false; });
  }
  function enhance(){ // 흑백 + 대비 늘리기 (인쇄 글자 강조)
    var im=ctx.getImageData(0,0,canvas.width,canvas.height), d=im.data, mn=255, mx=0, i, v;
    for(i=0;i<d.length;i+=4){ v=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000; d[i]=d[i+1]=d[i+2]=v; if(v<mn)mn=v; if(v>mx)mx=v; }
    var span=Math.max(1,mx-mn);
    for(i=0;i<d.length;i+=4){ v=(d[i]-mn)*255/span; d[i]=d[i+1]=d[i+2]=v; }
    ctx.putImageData(im,0,0);
  }
  /* ⑥ 읽은 글자에서 8자리 뽑기 — "NO."가 "N0."로 읽혀 앞에 0이 붙는 경우 처리 */
  function extract(text){
    var t=text.replace(/\s+/g,'');
    var m=t.match(/N?[O0]?\.?(\d{8})(?!\d)/);
    if(m) return m[1];
    var digits=t.replace(/\D/g,'');
    if(digits.length===8) return digits;
    if(digits.length===9&&/N/i.test(t)) return digits.slice(1);
    return null;
  }
  function handle(text){
    var no=extract(text);
    if(TEST) statusEl.textContent='읽음: '+JSON.stringify(text.trim());
    if(!no){ if(!TEST) statusEl.textContent='읽는 중'; guide.classList.remove('hit'); readEl.textContent=''; last=null; return; }
    readEl.innerHTML=no.replace(/(\d{4})(\d{4})/,'$1 $2')+'<small>한 번 더 확인 중</small>';
    if(last===no){ go(no); } else { last=no; }   // 연속 2회 같은 값이면 확정
  }

  /* ⑦ 시험 모드(?test=1): 사진 파일로 인식 확인 */
  if(TEST){
    var f=document.createElement('input'); f.type='file'; f.accept='image/*'; f.style.marginTop='1rem'; f.id='testFile';
    landing.insertBefore(f, $('.links'));
    f.addEventListener('change',function(){
      if(!this.files[0]) return; var img=new Image();
      img.onload=function(){
        var tw=520, th=Math.round(tw*img.height/img.width); canvas.width=tw; canvas.height=th; ctx.drawImage(img,0,0,tw,th); enhance();
        var run=function(){ worker.recognize(canvas).then(function(r){ var t=r.data.text||''; camMsg.textContent='읽음: '+JSON.stringify(t.trim())+' → '+(extract(t)||'없음'); }); };
        if(workerReady) run(); else { camMsg.textContent='엔진 준비 중…'; var iv=setInterval(function(){ if(workerReady){clearInterval(iv);run();} },200); }
      };
      img.src=URL.createObjectURL(this.files[0]);
    });
  }
})();
</script>
</body>
</html>
