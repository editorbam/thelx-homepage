<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; }
.card {
  width: 1200px;
  height: 630px;
  background: #0a0a0a url('why-car-side.jpg') center / cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
  overflow: hidden;
  font-family: 'Noto Sans KR', sans-serif;
}

/* 차량 사진 위 어두운 오버레이 — 차체가 비치도록 약하게 */
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 48%, rgba(10,10,10,0.28) 0%, rgba(10,10,10,0.55) 62%, rgba(10,10,10,0.72) 100%),
    linear-gradient(180deg, rgba(10,10,10,0.38) 0%, rgba(10,10,10,0.12) 38%, rgba(10,10,10,0.48) 100%);
}

/* 상단 보더라인 */
.card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent 10%, rgba(200,169,110,0.3) 50%, transparent 90%);
}

.content {
  position: relative;
  z-index: 1;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
}

.eyebrow {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: #c8a96e;
}

.logo {
  font-size: 52px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #ffffff;
  text-shadow: 0 2px 16px rgba(0,0,0,0.7);
}

.divider {
  width: 40px;
  height: 0.5px;
  background: rgba(255,255,255,0.15);
}

.headline {
  font-size: 36px;
  font-weight: 300;
  letter-spacing: -0.03em;
  line-height: 1.3;
  color: rgba(255,255,255,0.88);
  text-shadow: 0 2px 14px rgba(0,0,0,0.65);
}

.headline em {
  font-style: normal;
  font-weight: 600;
  color: #ffffff;
}

.sub {
  font-size: 14px;
  font-weight: 300;
  letter-spacing: 0.04em;
  color: rgba(255,255,255,0.35);
}

/* 하단 정보 */
.bottom {
  position: absolute;
  bottom: 36px;
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  gap: 32px;
  z-index: 1;
}

.bottom-item {
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.25);
  text-transform: uppercase;
}

.bottom-item .sep {
  margin: 0 12px;
  opacity: 0.4;
}
</style>
</head>
<body>
<div class="card">
  <div class="content">
    <span class="eyebrow">Solar Gard Premium · Saint-Gobain</span>
    <span class="logo">THE LX</span>
    <div class="divider"></div>
    <h1 class="headline">하루 90분의 <em>거실</em>.</h1>
    <p class="sub">매일 들어가는 차 안을 처음으로 설계한 필름</p>
  </div>
  <div class="bottom">
    <span class="bottom-item">퍼스트브랜드 2026<span class="sep">·</span>UV 99% 차단<span class="sep">·</span>최대 10년 보증<span class="sep">·</span>전국 437개 시공점</span>
  </div>
</div>

<!-- ===========================================================
     페이지별 공유 카드 (2026-08-04)
     이 파일 하나가 9종 카드의 단일 소스다. 파라미터 없이 열면 홈 카드,
     ?page=heat 처럼 열면 그 페이지 카드가 렌더된다.

     재생성 방법(로컬 렌더, 유료 생성 아님):
       Playwright로 og-image.html?page=<키> 를 1200×630으로 열고
       .card 요소를 JPEG(q88)로 저장 → og-<키>.jpg
       홈 카드는 파라미터 없이 열어 og-home.jpg 로 저장
     문구를 고칠 때는 아래 OG_CARDS만 고치고 해당 카드를 다시 뽑는다.
=========================================================== -->
<script>
const OG_CARDS = {
  technology: { eyebrow: 'Technology',      headline: '열을 막는 <em>두 가지 방법</em>.', sub: '흡수하지 않고, 반사합니다' },
  heat:       { eyebrow: 'Heat Rejection',  headline: '필름의 <em>열차단 원리</em>.',     sub: 'TSER, 총태양에너지차단율에 대한 이해' },
  recommend:  { eyebrow: 'Choosing a Film', headline: '선택의 <em>두 가지 기준</em>.',     sub: '숫자 하나가 아니라, 소재와 농도' },
  warranty:   { eyebrow: 'Authenticity',    headline: '<em>정품</em> 확인과 보증.',       sub: '공식 인증 시공점 · 정품 보증서 · 최대 10년' },
  stores:     { eyebrow: 'Find a Store',    headline: '내 근처 <em>시공점</em> 찾기.',     sub: '전국 437개 공식 인증 시공점' },
  pricing:    { eyebrow: 'Estimate',        headline: '<em>시공 견적</em>.',              sub: '승용차 기준 30만원부터, 즉시 계산' },
  story:      { eyebrow: 'Manifesto',       headline: '우리의 <em>이야기</em>.',          sub: '차 안에서 보내는 시간은 인생의 일부다' }
};
(function () {
  const key = new URLSearchParams(location.search).get('page');
  const c = key && OG_CARDS[key];
  if (!c) return;                       // 파라미터 없음·모르는 키 = 홈 카드 그대로
  document.querySelector('.eyebrow').textContent = c.eyebrow;
  document.querySelector('.headline').innerHTML = c.headline;
  document.querySelector('.sub').textContent = c.sub;
})();
</script>
</body>
</html>
